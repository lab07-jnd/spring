# Spring config properties
spring.config.import=optional:file:.env[.properties]

# Application Settings
spring.application.name = ${KEY_SPRING_APPLICATION_NAME}
server.port = ${KEY_SERVER_PORT}

# PostgreSQL Configuration
spring.datasource.url = ${KEY_SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/app}
spring.datasource.username = ${KEY_SPRING_DATASOURCE_USERNAME}
spring.datasource.password = ${KEY_SPRING_DATASOURCE_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto = validate

# Flyway
spring.flyway.enabled = true
spring.flyway.locations = classpath:db/migration

# JWT
jwt.secret = ${KEY_JWT_SECRET}