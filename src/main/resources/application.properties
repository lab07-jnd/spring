# Spring config properties
spring.config.import=optional:file:.env[.properties]

# Application Settings
spring.application.name = ${KEY_SPRING_APPLICATION_NAME:lab07-app}
server.port = ${KEY_SERVER_PORT:8080}

# PostgreSQL Configuration
spring.datasource.url = ${KEY_SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/appdb}
spring.datasource.username = ${KEY_SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password = ${KEY_SPRING_DATASOURCE_PASSWORD:postgres}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto = validate

# Flyway
spring.flyway.enabled = true
spring.flyway.locations = classpath:db/migration