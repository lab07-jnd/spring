services:
  postgres:
    image: postgres:16-alpine
    container_name: ${KEY_POSTGRES_CONTAINER_NAME:-app-db}
    environment:
      POSTGRES_DB: ${KEY_POSTGRES_DB:-app}
      POSTGRES_USER: ${KEY_POSTGRES_USER:-db}
      POSTGRES_PASSWORD: ${KEY_POSTGRES_PASSWORD:-pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - ${KEY_POSTGRES_CONTAINER_PORTS:-"5432:5432"}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yourway-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${KEY_SPRING_CONTAINER_NAME:-app-app}
    ports:
      - ${KEY_SPRING_CONTAINER_PORTS:-"8090:8090"}
    environment:
      SPRING_DATASOURCE_URL: ${KEY_SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/app}
      SPRING_DATASOURCE_USERNAME: ${KEY_SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${KEY_SPRING_DATASOURCE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yourway-network

volumes:
  postgres_data:
    driver: local

networks:
  yourway-network:
    driver: bridge
