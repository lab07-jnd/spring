services:
  postgres:
    image: postgres:16-alpine
    container_name: ${KEY_POSTGRES_CONTAINER_NAME:-lab07-postgres}
    environment:
      POSTGRES_DB: ${KEY_POSTGRES_DB:-appdb}
      POSTGRES_USER: ${KEY_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${KEY_POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - ${KEY_POSTGRES_CONTAINER_PORTS:-5432:5432}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yourway-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${KEY_SPRING_CONTAINER_NAME:-lab07-app}
    ports:
      - ${KEY_SPRING_CONTAINER_PORTS:-8080:8080}
    environment:
      SPRING_DATASOURCE_URL: ${KEY_SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/appdb}
      SPRING_DATASOURCE_USERNAME: ${KEY_SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${KEY_SPRING_DATASOURCE_PASSWORD:-postgres}
      KEY_SPRING_APPLICATION_NAME: ${KEY_SPRING_APPLICATION_NAME:-lab07-app}
      KEY_SERVER_PORT: ${KEY_SERVER_PORT:-8080}
      KEY_JWT_SECRET: ${KEY_JWT_SECRET:-change-me-in-production-with-a-strong-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yourway-network

volumes:
  postgres_data:
    driver: local

networks:
  yourway-network:
    driver: bridge
